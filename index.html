<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotlity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#77B1AD",
              "background-light": "#F8F9FA",
              "background-dark": "#121212",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Outfit", "sans-serif"],
            },
            borderRadius: { DEFAULT: "12px", 'xl': '20px' },
          },
        },
      };
    </script>
</head>
<body class="min-h-screen font-sans text-slate-800 dark:text-slate-100 transition-colors duration-300 overflow-hidden">
    <!-- Fixed header stays at top while scrolling -->
    <header class="fixed top-0 left-0 right-0 z-10 flex items-center justify-between px-6 py-4">
        <div>
            <!-- IDs let JavaScript find and update these elements -->
            <div id="headerGreeting" class="text-xl font-display font-semibold">Hello</div>
            <div class="flex items-center gap-3 mt-1">
                <span class="material-symbols-outlined text-lg" aria-hidden="true">schedule</span>
                <span id="headerTime">--:--</span>
                <span class="material-symbols-outlined text-lg" id="headerWeatherIcon" aria-hidden="true">wb_sunny</span>
                <span id="headerWeatherText">--°C</span>
            </div>
        </div>
    </header>
    <main class="relative w-full h-screen p-20"></main>

    <!-- Scripts load in order: app.js runs first, then time-weather.js updates the header -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/app.js"></script>
    <script src="js/time-weather.js"></script>
    <script src="js/pomodoro.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/music.js"></script>
    <script src="js/ambient.js"></script>
</body>
</html>
